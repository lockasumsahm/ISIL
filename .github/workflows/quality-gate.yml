name: quality-gate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  security-events: write

jobs:
  quality-gate:
    name: quality-gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v8
        with:
          enable-cache: true

      - name: Sync locked environment
        run: uv sync --locked

      - name: Ruff
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: MyPy
        run: uv run mypy app

      - name: Tests
        run: uv run pytest -q

      - name: Bandit
        run: uv run bandit -r app -ll

      - name: Dependency audit
        run: uv run pip-audit

      - name: CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: python

      - name: CodeQL analyze
        uses: github/codeql-action/analyze@v4
