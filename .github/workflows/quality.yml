name: ISIL Quality Gate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        run: uv python install 3.13

      - name: Sync locked environment
        run: uv sync --locked

      - name: Run tests
        run: uv run pytest -q

      - name: Check dependency lock
        run: uv lock --check
