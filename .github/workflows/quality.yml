name: quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@cec2083e6277c0a99b617c7a806ffedaca235ff9

        with:
          version: "0.12.7"
          enable-cache: true

      - name: Set Python
        run: uv python install 3.13

      - name: Sync locked environment
        run: uv sync --locked

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Ruff lint
        run: uv run ruff check .

      - name: Pyright
        run: uv run pyright

      - name: Tests
        run: uv run pytest -q

      - name: Dependency audit
        run: uv run pip-audit

      - name: Generate SBOM
        run: uv export --format cyclonedx1.5 --output-file sbom.cdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: isil-sbom
          path: sbom.cdx.json
          if-no-files-found: error
